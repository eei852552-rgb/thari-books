<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">The Country of the Quadlings</title>
<desc id="desc">Dorothy and her friends arrive in the friendly red country of the Quadlings, with a red-stone palace visible beyond flower gardens.</desc>
