<text x="70" y="60" fill="#65513e" font-family="Georgia,serif" font-size="34">A formal new visitor at Longbourn</text><text x="70" y="690" fill="#65513e" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">THARi BOOKS · PRIDE AND PREJUDICE · CHAPTER XIII</text>
