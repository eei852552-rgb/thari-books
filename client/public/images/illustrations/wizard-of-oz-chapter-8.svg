<circle cx="720" cy="420" r="30" fill="#bac9c9" stroke="#637b7e" stroke-width="5"/><path d="M685 460h70l20 110H665Z" fill="#bac9c9" stroke="#637b7e" stroke-width="5"/><path d="M690 480l-40 48M750 480l42 48" stroke="#9eafb0" stroke-width="16" stroke-linecap="round"/>
<text x="70" y="100" fill="#315b55" font-family="Georgia,serif" font-size="36">A field of scarlet flowers</text><text x="70" y="145" fill="#315b55" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">THARi BOOKS · CHAPTER VIII · COMPLETE TRANSLATION</text>
</svg>