<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Home Again</title>
<desc id="desc">Dorothy returns to the Kansas farmhouse and embraces Aunt Em in the warm sunlight, with Toto beside them.</desc>
