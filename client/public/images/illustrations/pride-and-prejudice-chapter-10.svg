<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">An evening at Netherfield</title>
<desc id="desc">Elizabeth sits in the Netherfield drawing room while Darcy writes a letter and the Bingley sisters talk nearby.</desc>
