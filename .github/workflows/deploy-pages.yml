name: Validate and manually deploy THARi BOOKS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the live GitHub Pages website"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Run automated tests
        run: pnpm test

      - name: Build for GitHub Pages
        run: pnpm build:static
        env:
          GITHUB_PAGES: "true"

      - name: Add GitHub Pages SPA fallback
        run: |
          cp dist/public/index.html dist/public/404.html
          test -s dist/public/404.html

      - name: Generate static book detail routes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, mkdirSync, writeFileSync } from "node:fs";

          const source = readFileSync("client/src/data/openBooks.ts", "utf8");
          const start = source.indexOf("export const openBooks");
          const end = source.indexOf("\n];", start);
          if (start < 0 || end < 0) {
            throw new Error("Could not locate the openBooks collection.");
          }

          const collection = source.slice(start, end);
          const ids = [...collection.matchAll(/^\s*id:\s*"([^"]+)",/gm)].map((match) => match[1]);
          if (ids.length === 0 || new Set(ids).size !== ids.length) {
            throw new Error("Book route IDs are missing or duplicated.");
          }

          const html = readFileSync("dist/public/index.html", "utf8");
          for (const id of ids) {
            if (!/^[a-z0-9-]+$/.test(id)) {
              throw new Error(`Unsafe book route ID: ${id}`);
            }
            const directory = `dist/public/book/${id}`;
            mkdirSync(directory, { recursive: true });
            writeFileSync(`${directory}/index.html`, html);
          }

          if (!ids.includes("aka-thazin-spring-winter")) {
            throw new Error("Book 12 route was not found in openBooks.");
          }
          console.log(`Generated ${ids.length} static book detail routes.`);
          NODE
          test -s dist/public/book/aka-thazin-spring-winter/index.html

      - name: Verify built homepage and assets
        run: |
          test -s dist/public/index.html
          test -s dist/public/404.html
          test -s dist/public/book/aka-thazin-spring-winter/index.html
          test -s dist/public/images/library-hero.svg
          test -s dist/public/api/platform/config.js
          grep -q "/thari-books/" dist/public/index.html

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    name: Publish website
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
