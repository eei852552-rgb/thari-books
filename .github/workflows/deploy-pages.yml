name: Validate and manually deploy THARi BOOKS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the live GitHub Pages website"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Run automated tests
        run: pnpm test

      - name: Build for GitHub Pages
        run: pnpm build:static
        env:
          GITHUB_PAGES: "true"

      - name: Verify built homepage and assets
        run: |
          test -s dist/public/index.html
          test -s dist/public/images/library-hero.svg
          test -s dist/public/api/platform/config.js
          grep -q "/thari-books/" dist/public/index.html

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    name: Publish website
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
